[build]
  # Installs the root package.json deps (incl. serverless-http), then
  # builds the client and installs/generates the server's Prisma client
  # so the function bundle has everything it needs.
  command = "npm run netlify-build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  # zisi (Netlify's non-esbuild bundler) traces real requires/imports and
  # copies actual files/folders, including native binaries, instead of
  # merging everything into one JS file. Prisma's compiled query-engine
  # file gets lost when esbuild tries to bundle it into a single file
  # ("Cannot find module '@prisma/client'" at runtime) — zisi avoids that
  # entirely, which is why it's the recommended bundler for Prisma on
  # Netlify Functions specifically.
  node_bundler = "zisi"

# The SPA calls same-origin /api/... — route that to the function instead
# of falling through to the SPA fallback below. Uploaded prize photos are
# served from Cloudinary (full URLs), so no /uploads redirect is needed.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side routing (react-router-dom) — let the SPA handle unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
