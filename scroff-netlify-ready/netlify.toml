[build]
  # Installs the root package.json deps (incl. serverless-http), then
  # builds the client and installs/generates the server's Prisma client
  # so the function bundle has everything it needs.
  command = "npm run netlify-build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  # esbuild handles this function's ESM (.mjs) syntax correctly, which the
  # alternative bundler (zisi) doesn't — but esbuild can't bundle Prisma's
  # native query-engine binary as JS. Keeping @prisma/client external (not
  # bundled into the JS) and explicitly including its real files solves
  # that, now that @prisma/client lives in root node_modules — an ancestor
  # directory of netlify/functions, which the bundler can actually resolve
  # (server/node_modules, a sibling directory, could not be found this way,
  # which caused the earlier "Cannot find module '@prisma/client'" error).
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["node_modules/@prisma/client/**"]

# The SPA calls same-origin /api/... — route that to the function instead
# of falling through to the SPA fallback below. Uploaded prize photos are
# served from Cloudinary (full URLs), so no /uploads redirect is needed.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Client-side routing (react-router-dom) — let the SPA handle unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
